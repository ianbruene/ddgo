name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test controller ownership
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./internal/app ./internal/macro

      - name: Repeated focused command admission tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -count=20 ./internal/app -run 'ResponseOwner|Interactive|ManualLine|Disconnect|CommandAdmission|DelayedManualLineResponse|ConnectionTransition|ConnectAttempt|ConcurrentConnect|RealtimeWrite'

      - name: Repeated focused connection race tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -race -count=20 ./internal/app -run 'ConnectionTransition|ConnectAttempt|ConcurrentConnect|RealtimeWrite|SoftReset'

      - name: Repeated connection generation isolation tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -count=50 ./internal/app -run 'Generation|StaleEvent|StaleRX|StaleDisconnect|ResponseOwner|ConnectAttempt|Reconnect'
          go test -race -count=20 ./internal/app -run 'Generation|StaleEvent|StaleRX|StaleDisconnect|ResponseOwner|ConnectAttempt|Reconnect'
          go test -race -count=50 -tags serial ./internal/transport -run 'Generation|Reconnect|Stale|ReadLoop'

      - name: Test serial-tagged packages
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags serial ./internal/transport ./internal/ports ./internal/app ./internal/grbl

      - name: Build
        run: go build ./...

      - name: Smoke test mockgrbl
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/ci_mockgrbl_smoke.sh

      - name: Test mockgrbl integration
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -tags 'serial mockgrbl_e2e' ./internal/integration/mockgrbl
